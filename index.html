<!DOCTYPE html>
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 20px;
        }
        .delete-btn {
            margin-left: 10px;
        }
        .done-btn {
            margin-left: 5px;
        }
        /* существующие стили остаются, Bootstrap их дополнит */
    </style>
</head>

<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <!-- Карточка для красивого оформления -->
                <div class="card shadow-sm mt-5">
                    <div class="card-header bg-primary text-white">
                        <h1 class="h4 mb-0 text-center">
                            <i class="bi bi-check2-circle me-2"></i>My To-Do List
                        </h1>
                    </div>
                    
                    <div class="card-body">
                        <!-- форма остается полностью рабочей -->
                        <form id="todoForm" class="mb-4">
                            <div class="input-group">
                                <input type="text" 
                                       id="taskInput" 
                                       name="task" 
                                       class="form-control form-control-lg" 
                                       placeholder="What needs to be done?" 
                                       required>
                                <button type="submit" 
                                        id="addTask" 
                                        name="action" 
                                        value="add"
                                        class="btn btn-primary btn-lg">
                                    <i class="bi bi-plus-lg me-1"></i> Add
                                </button>
                            </div>
                        </form>
                        
                        <!-- список задач! -->
                        <ul id="taskList" class="list-group">
                            <!-- JS будет добавлять задачи сюда -->
                        </ul>
                        
                        <!-- Простой счетчик задач (необязательно, но полезно) -->
                        <div class="mt-3 text-muted small text-center">
                            <span id="taskCounter">0 tasks</span>
                        </div>
                    </div>
                </div>
                
                <!-- Подсказка для пользователя -->
                <div class="text-center mt-3 text-muted small">
                    <i class="bi bi-info-circle me-1"></i>Click "Done" to complete, "Delete" to remove
                </div>
            </div>
        </div>
    </div>

</body>
</html>
